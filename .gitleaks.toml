# Shadow detects and masks secrets, so its benchmark datasets and tests contain synthetic,
# realistic-looking keys on purpose (generated by bench/datasets/generate.py or written as
# fixtures). None of them is a real credential.
[extend]
useDefault = true

[allowlist]
description = "synthetic secrets in benchmark data, tests and docs examples"
paths = [
  '''bench/datasets/.*\.jsonl$''',
  '''bench/results[^/]*/.*''',
  '''crates/.*/tests/.*''',
  '''crates/shadow-core/src/detect/patterns\.rs$''',
  '''docs-site/src/content/docs/.*\.mdx?$''',
  # Hostnames and docs URLs only (catalog_is_well_formed rejects anything else); API hosts
  # such as asr.api.speechmatics.com trip the generic-api-key rule.
  '''crates/shadow-core/catalog\.json$''',
]
