# The menu-bar / system-tray companion. Deliberately its own workspace so the main
# `cargo build/test/clippy --workspace` (and Linux CI) never needs webview system libraries.
#
#   cd apps/shadow-tray && cargo run --release
[workspace]

[package]
name = "shadow-tray"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Menu-bar / system-tray app for Shadow: protection status, today's counts and the activity dashboard."
repository = "https://github.com/Tiny-Bubble-Company/shadow"
publish = false

[dependencies]
serde_json = "1"
tao = "0.37"
tray-icon = "0.24"
wry = "0.57"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
