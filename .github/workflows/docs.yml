name: Docs

# Builds docs-site/ (Astro Starlight) and deploys it to GitHub Pages at
# https://tiny-bubble-company.github.io/shadow
#
# The repository is private for now, so this runs only on manual dispatch.
# When the repository goes public and Pages is enabled (Settings -> Pages -> Source:
# "GitHub Actions"), switch the trigger to deploy on every push to main:
#
#   on:
#     push:
#       branches: [main]
#       paths: ["docs-site/**", ".github/workflows/docs.yml"]
#     workflow_dispatch:

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so each page's dateModified (JSON-LD) comes from git.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: docs-site/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # SITE and BASE set canonical URLs, the sitemap, robots.txt, llms.txt and JSON-LD.
      # They follow the Pages configuration (a custom domain gives BASE=""), and can be
      # pinned with the DOCS_SITE / DOCS_BASE repository variables.
      - run: pnpm build
        env:
          SITE: ${{ vars.DOCS_SITE || steps.pages.outputs.origin }}
          BASE: ${{ vars.DOCS_BASE || steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
