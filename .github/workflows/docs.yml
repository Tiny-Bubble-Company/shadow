name: Docs

# Builds docs-site/ (Astro Starlight) and deploys it to GitHub Pages at
# https://tiny-bubble-company.github.io/shadow
#
# The repository is private for now, so this runs only on manual dispatch.
# When the repository goes public and Pages is enabled (Settings -> Pages -> Source:
# "GitHub Actions"), switch the trigger to deploy on every push to main:
#
#   on:
#     push:
#       branches: [main]
#       paths: ["docs-site/**", ".github/workflows/docs.yml"]
#     workflow_dispatch:

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs-site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
