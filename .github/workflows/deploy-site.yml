name: Deploy site

# Builds docs-site/ and deploys it to Cloudflare Workers (https://getshadow.dev) on every
# push to main that touches the site.
#
# Repository settings needed:
#   secrets.CLOUDFLARE_API_TOKEN    API token with "Workers Scripts: Edit" for the account
#   secrets.CLOUDFLARE_ACCOUNT_ID   Cloudflare account ID
#   vars.CLOUDFLARE_WORKER_NAME     optional, the Worker serving getshadow.dev (default: getshadow)
# Without the secrets the site is built but not deployed.

on:
  push:
    branches: [main]
    paths: ["docs-site/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so each page's dateModified (JSON-LD) comes from git.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: docs-site/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node deploy/csp.mjs dist dist/_headers
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME || 'getshadow' }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set; built the site but skipped the deploy."
            exit 0
          fi
          pnpm dlx wrangler@4.20.0 deploy --name "$WORKER_NAME"
