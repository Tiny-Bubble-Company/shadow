<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Shadow</title>
  <desc id="desc">Privacy layer for AI traffic. Your data leaves under a different name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0A16"/>
      <stop offset="0.6" stop-color="#121029"/>
      <stop offset="1" stop-color="#1A1440"/>
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="300" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C6CFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="1050" cy="520" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B8FF"/>
      <stop offset="0.55" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#4F3FE0"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9C2FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <mask id="crescent">
      <rect x="0" y="0" width="1280" height="640" fill="#fff"/>
      <circle cx="184" cy="222" r="57" fill="#000"/>
    </mask>
    <style>
      .sans { font-family: Inter, "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <!-- mark -->
  <circle cx="157" cy="240" r="81" fill="none" stroke="url(#mark)" stroke-width="5" stroke-opacity="0.45"/>
  <circle cx="157" cy="240" r="66" fill="url(#mark)" mask="url(#crescent)"/>

  <!-- wordmark -->
  <text x="268" y="278" class="sans" font-size="112" font-weight="700" letter-spacing="-3" fill="url(#word)">Shadow</text>
  <text x="80" y="390" class="sans" font-size="34" font-weight="600" fill="#ECEAFF">Privacy layer for AI traffic</text>
  <text x="80" y="436" class="sans" font-size="26" font-weight="400" fill="#A59FD0">Your data leaves under a different name.</text>

  <!-- pills -->
  <g class="sans" font-size="17" font-weight="500" fill="#CFC9FF">
    <rect x="80" y="486" width="132" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#7C6CFF" stroke-opacity="0.45"/>
    <text x="146" y="510" text-anchor="middle">Local-first</text>
    <rect x="224" y="486" width="132" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#7C6CFF" stroke-opacity="0.45"/>
    <text x="290" y="510" text-anchor="middle">Reversible</text>
    <rect x="368" y="486" width="166" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#7C6CFF" stroke-opacity="0.45"/>
    <text x="451" y="510" text-anchor="middle">Stream-aware</text>
    <rect x="546" y="486" width="110" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#7C6CFF" stroke-opacity="0.45"/>
    <text x="601" y="510" text-anchor="middle">Rust</text>
  </g>

  <!-- translation card -->
  <g transform="translate(720 140)">
    <rect width="480" height="360" rx="18" fill="#0E0D1F" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <circle cx="28" cy="28" r="6" fill="#FF5F57" fill-opacity="0.85"/>
    <circle cx="48" cy="28" r="6" fill="#FEBC2E" fill-opacity="0.85"/>
    <circle cx="68" cy="28" r="6" fill="#28C840" fill-opacity="0.85"/>
    <text x="452" y="33" text-anchor="end" class="mono" font-size="14" fill="#8C86B8">real → what the provider sees</text>
    <line x1="0" y1="54" x2="480" y2="54" stroke="#FFFFFF" stroke-opacity="0.07"/>

    <g class="mono" font-size="16">
      <text x="28" y="96" fill="#8C86B8">you write</text>
      <text x="28" y="124" fill="#F1EFFF">jane@acme.com</text>
      <text x="28" y="160" fill="#8C86B8">the model reads</text>
      <text x="28" y="188" fill="#B4A9FF">hui.zhao@zhilan.cn</text>

      <line x1="28" y1="214" x2="452" y2="214" stroke="#FFFFFF" stroke-opacity="0.07"/>

      <text x="28" y="250" fill="#F1EFFF">Acme GmbH</text>
      <text x="234" y="250" fill="#7C6CFF">→</text>
      <text x="260" y="250" fill="#B4A9FF">Zhilan Technology</text>
      <text x="28" y="284" fill="#F1EFFF">Project Falcon</text>
      <text x="234" y="284" fill="#7C6CFF">→</text>
      <text x="260" y="284" fill="#B4A9FF">Velora Quilent</text>
      <text x="28" y="318" fill="#F1EFFF">4111 1111 1111 1111</text>
      <text x="234" y="318" fill="#7C6CFF">→</text>
      <text x="260" y="318" fill="#B4A9FF">4837 2191 9471 3480</text>
    </g>
    <path d="M318 182 C 372 182, 372 118, 318 118" fill="none" stroke="#7C6CFF" stroke-width="2" stroke-dasharray="4 5"/>
    <path d="M316 118 l 9 -5 v 10 z" fill="#7C6CFF"/>
    <text x="384" y="146" class="sans" font-size="14" fill="#8C86B8">restored</text>
    <text x="384" y="164" class="sans" font-size="14" fill="#8C86B8">on return</text>
  </g>
</svg>
