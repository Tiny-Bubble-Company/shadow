<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
  <title id="t">Shadow architecture</title>
  <desc id="d">Apps send requests through Shadow on the endpoint. Shadow detects sensitive values, applies the intent policy, translates real values to fakes using the persona and encrypted vault, and forwards to the AI provider. Responses, including streams and tool calls, are restored before they reach the app. Non-AI hosts are tunnelled without decryption.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D0C1A"/>
      <stop offset="1" stop-color="#16123A"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8B7CFF"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5EC8F2"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6B6790"/>
    </marker>
    <style>
      .s { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .m { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .box { fill: #1A1836; stroke: #FFFFFF; stroke-opacity: .12; }
      .step { fill: #221F48; stroke: #8B7CFF; stroke-opacity: .55; }
      .h { fill: #F1EFFF; font-weight: 600; font-size: 17px; }
      .sub { fill: #A59FD0; font-size: 13px; }
      .lbl { fill: #CFC9FF; font-size: 13px; }
    </style>
  </defs>
  <rect width="1200" height="600" rx="20" fill="url(#bg)"/>

  <!-- apps -->
  <rect class="box" x="30" y="150" width="190" height="220" rx="14"/>
  <text class="s h" x="125" y="184" text-anchor="middle">Your apps</text>
  <g class="s sub" text-anchor="middle">
    <text x="125" y="220">SDKs · CLIs</text>
    <text x="125" y="244">IDEs · desktop apps</text>
    <text x="125" y="268">agents · services</text>
  </g>
  <g class="m" font-size="12" fill="#8C86B8" text-anchor="middle">
    <text x="125" y="314">HTTPS_PROXY</text>
    <text x="125" y="334">/gw/&lt;provider&gt;</text>
    <text x="125" y="354">shadow-core (Rust)</text>
  </g>

  <!-- shadow -->
  <rect x="270" y="60" width="650" height="400" rx="18" fill="#141230" stroke="#8B7CFF" stroke-opacity=".7" stroke-width="1.5"/>
  <text class="s" x="295" y="94" fill="#F1EFFF" font-size="19" font-weight="700">Shadow</text>
  <text class="s sub" x="372" y="94">on your machine · 127.0.0.1:8877</text>

  <!-- request lane -->
  <rect class="step" x="295" y="120" width="140" height="78" rx="12"/>
  <text class="s h" x="365" y="152" text-anchor="middle">Detect</text>
  <text class="s sub" x="365" y="176" text-anchor="middle">regex · checksum</text>
  <text class="s sub" x="365" y="192" text-anchor="middle">dictionary · NER</text>

  <rect class="step" x="455" y="120" width="140" height="78" rx="12"/>
  <text class="s h" x="525" y="152" text-anchor="middle">Policy</text>
  <text class="s sub" x="525" y="176" text-anchor="middle">intent: act · report</text>
  <text class="s sub" x="525" y="192" text-anchor="middle">code · converse</text>

  <rect class="step" x="615" y="120" width="140" height="78" rx="12"/>
  <text class="s h" x="685" y="152" text-anchor="middle">Translate</text>
  <text class="s sub" x="685" y="176" text-anchor="middle">real → fake / token</text>
  <text class="s sub" x="685" y="192" text-anchor="middle">files · headers · ids</text>

  <line x1="435" y1="159" x2="451" y2="159" stroke="#8B7CFF" stroke-width="2" marker-end="url(#a)"/>
  <line x1="595" y1="159" x2="611" y2="159" stroke="#8B7CFF" stroke-width="2" marker-end="url(#a)"/>

  <!-- state -->
  <rect class="box" x="455" y="232" width="140" height="70" rx="12"/>
  <text class="s h" x="525" y="262" text-anchor="middle">Persona</text>
  <text class="s sub" x="525" y="284" text-anchor="middle">company · people · region</text>
  <rect class="box" x="615" y="232" width="140" height="70" rx="12"/>
  <text class="s h" x="685" y="262" text-anchor="middle">Vault</text>
  <text class="s sub" x="685" y="284" text-anchor="middle">encrypted · local</text>
  <line x1="595" y1="267" x2="611" y2="267" stroke="#6B6790" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="685" y1="232" x2="685" y2="202" stroke="#6B6790" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#c)"/>
  <line x1="685" y1="302" x2="685" y2="332" stroke="#6B6790" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#c)"/>

  <!-- response lane -->
  <rect class="step" x="295" y="336" width="460" height="78" rx="12" style="stroke:#5EC8F2"/>
  <text class="s h" x="525" y="368" text-anchor="middle">Restore</text>
  <text class="s sub" x="525" y="392" text-anchor="middle">fake → real in JSON, SSE / NDJSON streams and tool-call arguments</text>

  <!-- detector extras -->
  <text class="s sub" x="785" y="226">optional detectors</text>
  <rect class="box" x="785" y="236" width="115" height="30" rx="8"/>
  <text class="m" x="842" y="256" font-size="12" fill="#CFC9FF" text-anchor="middle">ml/ NER</text>
  <rect class="box" x="785" y="272" width="115" height="30" rx="8"/>
  <text class="m" x="842" y="292" font-size="12" fill="#CFC9FF" text-anchor="middle">Presidio</text>
  <text class="s sub" x="785" y="320">loopback · fail-open</text>

  <!-- provider -->
  <rect class="box" x="980" y="150" width="190" height="220" rx="14"/>
  <text class="s h" x="1075" y="184" text-anchor="middle">AI provider</text>
  <g class="s sub" text-anchor="middle">
    <text x="1075" y="220">OpenAI · Anthropic</text>
    <text x="1075" y="244">Gemini · Azure OpenAI</text>
    <text x="1075" y="268">OpenRouter · Mistral</text>
    <text x="1075" y="292">Groq · and more</text>
  </g>
  <text class="s" x="1075" y="340" text-anchor="middle" font-size="12" fill="#8C86B8">sees only the persona</text>

  <!-- flows -->
  <path d="M220 200 H 291" stroke="#8B7CFF" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M755 159 H 950 V 200 H 976" stroke="#8B7CFF" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text class="s lbl" x="772" y="148">masked request</text>
  <path d="M980 330 H 950 V 375 H 759" stroke="#5EC8F2" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <text class="s lbl" x="772" y="366" style="fill:#9FDDF6">response / stream</text>
  <path d="M295 375 H 250 V 320 H 224" stroke="#5EC8F2" stroke-width="2" fill="none" marker-end="url(#b)"/>

  <!-- tunnel -->
  <path d="M125 370 V 530 H 976" stroke="#6B6790" stroke-width="1.5" stroke-dasharray="6 6" fill="none" marker-end="url(#c)"/>
  <rect class="box" x="980" y="505" width="190" height="50" rx="12"/>
  <text class="s h" x="1075" y="536" text-anchor="middle" style="font-size:15px">Other hosts</text>
  <text class="s sub" x="560" y="518" text-anchor="middle">non-AI traffic: blind TLS tunnel, never decrypted</text>
</svg>
